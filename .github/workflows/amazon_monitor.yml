name: Monitoreo de Amazon (Cada 2 min)

on:
  schedule:
    - cron: '*/2 * * * *' # Solicita arranque continuo a GitHub
  workflow_dispatch: # Permite iniciarlo manualmente con un clic

# Evita que se encimen dos procesos al mismo tiempo; si uno sigue corriendo, espera a que termine
concurrency:
  group: monitor-amazon
  cancel-in-progress: false

jobs:
  monitorear:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Corta a los 60 min para dar paso al siguiente ciclo
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar bucle de monitoreo (cada 2 min)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u monitor.py
